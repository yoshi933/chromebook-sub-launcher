<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8fafd">
<title>My Chromebook Launcher</title>
<style>
:root{color-scheme:light;--bg:#f8fafd;--surface:#fff;--text:#202124;--muted:#6b7280;--line:#dfe3eb;--accent:#1769e0;--accent-soft:#e8f0fe;--shadow:0 10px 30px #1f3b5d12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#eaf2ff 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;cursor:pointer}.topbar{max-width:1120px;margin:auto;padding:28px 24px 12px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px;min-width:220px}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#4285f4,#7b61ff);display:grid;place-items:center;color:#fff;font-size:21px;box-shadow:0 5px 12px #4285f438}.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}.search{flex:1;position:relative}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:24px;padding:0 48px;background:var(--surface);outline:0;box-shadow:var(--shadow)}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #1769e01c}.search span{position:absolute;left:18px;top:11px;color:var(--muted);font-size:20px}.actions{display:flex;gap:8px}.icon-btn,.primary,.secondary{border-radius:10px;padding:10px 13px}.icon-btn{background:transparent;color:var(--muted);font-size:18px}.icon-btn:hover{background:#e9eef7;color:var(--text)}.primary{background:var(--accent);color:#fff}.secondary{background:var(--accent-soft);color:#1356bd}.content{max-width:1120px;margin:auto;padding:8px 24px 44px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}.section-head h2{font-size:15px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}.app{position:relative;min-height:116px;padding:12px 8px 8px;border:1px solid transparent;border-radius:16px;text-align:center;background:transparent;transition:.18s;user-select:none}.app:hover{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow);transform:translateY(-2px)}.app.dragging{opacity:.45}.app.over{border-color:var(--accent);background:var(--accent-soft)}.app button.launch{display:block;width:100%;background:transparent;color:inherit}.app-icon{width:58px;height:58px;margin:0 auto 8px;border-radius:15px;display:grid;place-items:center;overflow:hidden;background:#edf2f8;color:#4b5563;font-size:28px;font-weight:700}.app-icon img{width:100%;height:100%;object-fit:cover}.app-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.pin{position:absolute;right:5px;top:4px;width:25px;height:25px;border-radius:50%;background:transparent;color:#9aa3b2;opacity:0}.app:hover .pin,.pin.active{opacity:1}.pin.active{color:var(--accent);background:var(--accent-soft)}.empty{padding:42px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:#ffffff80}.footer{max-width:1120px;margin:auto;padding:0 24px 24px;text-align:center;color:var(--muted);font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#17203366;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(560px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--surface);border-radius:18px;padding:22px;box-shadow:0 24px 70px #11213d40}.modal h2{margin:0 0 18px;font-size:18px}.form-grid{display:grid;gap:12px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;outline:0}.field textarea{min-height:72px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--accent)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.manage-list{display:grid;gap:8px;margin-top:16px}.manage-item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px}.manage-item .mini{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#edf2f8;overflow:hidden}.manage-item .mini img{width:100%;height:100%;object-fit:cover}.manage-item .grow{flex:1}.manage-item small{display:block;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 15px;border-radius:9px;z-index:8;box-shadow:var(--shadow)}@media(max-width:650px){.topbar{padding:18px 14px 8px;flex-wrap:wrap}.brand{min-width:auto}.search{order:3;flex-basis:100%}.content{padding:8px 14px 35px}.grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}.app{min-height:104px;padding-inline:4px}.app-icon{width:52px;height:52px}.actions .label{display:none}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">▦</div><div><h1>My Chromebook Launcher</h1><small>自分用サブランチャー</small></div></div><div class="search"><span>⌕</span><input id="search" type="search" placeholder="アプリを検索…（Ctrl / ⌘ + K）" autocomplete="off"></div><div class="actions"><button class="icon-btn" id="manage" title="アプリを管理">⚙</button><button class="primary" id="add"><span class="label">アプリを追加</span><span class="mobile-plus">＋</span></button></div></header>
<main class="content"><section id="recentSection"><div class="section-head"><h2>最近使ったアプリ</h2><span id="recentCount"></span></div><div class="grid" id="recentGrid"></div></section><section><div class="section-head"><h2>すべてのアプリ</h2><span id="appCount"></span></div><div class="grid" id="appGrid"></div><div class="empty hidden" id="empty">まだアプリがありません。右上の「アプリを追加」から登録してください。</div></section></main><footer class="footer">ドラッグ＆ドロップで並び替え · ピンで上部に固定 · データはこのブラウザのローカルストレージに保存</footer>
<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">アプリを追加</h2><form id="appForm"><div class="form-grid"><div class="field"><label for="name">アプリ名 *</label><input id="name" required maxlength="40" placeholder="例：Google ドライブ"></div><div class="field"><label for="url">URL *</label><input id="url" type="url" required placeholder="https://drive.google.com/"></div><div class="field"><label for="icon">アイコンURL（任意）</label><input id="icon" type="url" placeholder="https://…/favicon.png"><small>空欄ならサイトのファビコンを自動取得します。絵文字も入力できます。</small></div><div class="field"><label for="note">メモ（任意）</label><input id="note" maxlength="80" placeholder="仕事用、学校用など"></div></div><div class="modal-actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button class="primary" type="submit">保存</button></div></form></div></div>
<div class="modal-backdrop hidden" id="manageBackdrop"><div class="modal"><h2>アプリを管理</h2><p style="color:var(--muted);margin-top:-8px">登録内容の編集・削除、データのバックアップができます。</p><div class="modal-actions" style="justify-content:flex-start"><button class="secondary" id="export">JSONを書き出す</button><button class="secondary" id="importBtn">JSONを読み込む</button><input id="importFile" type="file" accept="application/json" class="hidden"></div><div class="manage-list" id="manageList"></div><div class="modal-actions"><button class="secondary" id="manageClose">閉じる</button></div></div></div>
<div class="toast hidden" id="toast"></div>
<script>
(() => {
  const KEY='my-chromebook-launcher-v1';
  const starter=[
    {id:'drive',name:'Google ドライブ',url:'https://drive.google.com/',icon:'https://ssl.gstatic.com/docs/drive/images/drive_2022q4_64dp.png',pinned:true,note:'',recent:0},
    {id:'youtube',name:'YouTube',url:'https://www.youtube.com/',icon:'https://www.youtube.com/s/desktop/40b271ca/img/favicon_144x144.png',pinned:false,note:'',recent:0},
    {id:'calendar',name:'Google カレンダー',url:'https://calendar.google.com/',icon:'https://ssl.gstatic.com/calendar/images/dynamiclogo_2020q4/calendar_31_2x.png',pinned:false,note:'',recent:0},
    {id:'github',name:'GitHub',url:'https://github.com/',icon:'https://github.githubassets.com/favicons/favicon.png',pinned:false,note:'',recent:0}
  ];
  let apps=load(), editingId=null, dragId=null;
  const $=id=>document.getElementById(id);
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)&&x.length?x:starter}catch{return starter}}
  function save(){localStorage.setItem(KEY,JSON.stringify(apps))}
  function favicon(a){return a.icon||`https://www.google.com/s2/favicons?domain=${encodeURIComponent(a.url)}&sz=128`}
  function iconMarkup(a,mini=false){const icon=a.icon||''; if(icon && !icon.includes('/') && !icon.includes(':'))return `<span>${escapeHtml(icon)}</span>`;return `<img src="${escapeAttr(favicon(a))}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${escapeJs((a.name||'?')[0])}'">`}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function escapeAttr(s){return escapeHtml(s)} function escapeJs(s){return String(s).replace(/['\\]/g,'\\$&')}
  function appCard(a){const el=document.createElement('article');el.className='app';el.draggable=true;el.dataset.id=a.id;el.innerHTML=`<button class="launch" title="${escapeAttr(a.note||a.name)}"><div class="app-icon">${iconMarkup(a)}</div><span class="app-name">${escapeHtml(a.name)}</span></button><button class="pin ${a.pinned?'active':''}" title="${a.pinned?'固定を解除':'上部に固定'}">★</button>`;el.querySelector('.launch').onclick=()=>launch(a);el.querySelector('.pin').onclick=e=>{e.stopPropagation();a.pinned=!a.pinned;save();render()};el.addEventListener('dragstart',()=>{dragId=a.id;el.classList.add('dragging')});el.addEventListener('dragend',()=>{dragId=null;el.classList.remove('dragging')});el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');reorder(dragId,a.id)});return el}
  function reorder(from,to){if(!from||from===to)return;const fromI=apps.findIndex(a=>a.id===from),toI=apps.findIndex(a=>a.id===to);const [m]=apps.splice(fromI,1);apps.splice(toI,0,m);save();render()}
  function launch(a){a.recent=Date.now();save();render();window.open(a.url,'_blank','noopener')}
  function render(){const q=$('search').value.trim().toLowerCase();const filtered=apps.filter(a=>!q||`${a.name} ${a.note} ${a.url}`.toLowerCase().includes(q));const recent=filtered.filter(a=>a.recent).sort((a,b)=>b.recent-a.recent).slice(0,8);$('recentGrid').replaceChildren(...recent.map(appCard));$('recentSection').classList.toggle('hidden',!recent.length||!!q);const ordered=filtered.slice().sort((a,b)=>(b.pinned-a.pinned)||0);$('appGrid').replaceChildren(...ordered.map(appCard));$('appCount').textContent=`${filtered.length}件`;$('recentCount').textContent=recent.length?`${recent.length}件`:'';$('empty').classList.toggle('hidden',filtered.length>0)}
  function openForm(a){editingId=a?.id||null;$('modalTitle').textContent=a?'アプリを編集':'アプリを追加';$('name').value=a?.name||'';$('url').value=a?.url||'';$('icon').value=a?.icon||'';$('note').value=a?.note||'';$('modalBackdrop').classList.remove('hidden');$('name').focus()}
  function closeForm(){$('modalBackdrop').classList.add('hidden');editingId=null}
  function renderManage(){const list=$('manageList');list.replaceChildren(...apps.map(a=>{const row=document.createElement('div');row.className='manage-item';row.innerHTML=`<div class="mini">${iconMarkup(a,true)}</div><div class="grow"><b>${escapeHtml(a.name)}</b><small>${escapeHtml(a.url)}</small></div><button class="icon-btn edit" title="編集">✎</button><button class="icon-btn del" title="削除">🗑</button>`;row.querySelector('.edit').onclick=()=>openForm(a);row.querySelector('.del').onclick=()=>{if(confirm(`「${a.name}」を削除しますか？`)){apps=apps.filter(x=>x.id!==a.id);save();renderManage();render()}};return row}))}
  function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
  $('search').oninput=render;$('search').onkeydown=e=>{if(e.key==='Escape'){$('search').value='';render()}};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus()}});
  $('add').onclick=()=>openForm();$('cancel').onclick=closeForm;$('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeForm()};$('appForm').onsubmit=e=>{e.preventDefault();const data={name:$('name').value.trim(),url:$('url').value.trim(),icon:$('icon').value.trim(),note:$('note').value.trim()};if(editingId){Object.assign(apps.find(a=>a.id===editingId),data)}else apps.push({id:crypto.randomUUID(),...data,pinned:false,recent:0});save();closeForm();render();renderManage();toast('保存しました')};
  $('manage').onclick=()=>{$('manageBackdrop').classList.remove('hidden');renderManage()};$('manageClose').onclick=()=> $('manageBackdrop').classList.add('hidden');$('manageBackdrop').onclick=e=>{if(e.target.id==='manageBackdrop')$('manageBackdrop').classList.add('hidden')};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(apps,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-chromebook-launcher.json';a.click();URL.revokeObjectURL(a.href);toast('書き出しました')};$('importBtn').onclick=()=> $('importFile').click();$('importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||data.some(a=>!a.name||!a.url))throw Error();apps=data.map(a=>({...a,id:a.id||crypto.randomUUID(),pinned:!!a.pinned,recent:Number(a.recent)||0}));save();render();renderManage();toast('読み込みました')}catch{alert('正しいランチャーJSONを選択してください')}e.target.value=''};
  render();
})();
</script>
</body>
</html>
