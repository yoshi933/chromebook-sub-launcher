<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafd"><title>Chromebook Launcher</title>
<style>
:root{color-scheme:light;--bg:#f8fafd;--surface:#fff;--text:#202124;--muted:#6b7280;--line:#dfe3eb;--accent:#1769e0;--accent-soft:#e8f0fe;--icon-bg:#edf2f8;--shadow:0 10px 30px #1f3b5d12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#eaf2ff 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{border:0;cursor:pointer}.topbar{max-width:1120px;margin:auto;padding:28px 24px 12px;display:flex;align-items:center;gap:14px}.search{flex:1;position:relative}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:24px;padding:0 48px;background:var(--surface);color:var(--text);outline:0;box-shadow:var(--shadow)}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #1769e01c}.search span{position:absolute;left:18px;top:11px;color:var(--muted);font-size:20px}.actions{display:flex;gap:8px}.icon-btn,.primary,.secondary{border-radius:10px;padding:10px 13px}.icon-btn{background:transparent;color:var(--muted);font-size:18px}.icon-btn:hover{background:var(--accent-soft);color:var(--text)}.primary{background:var(--accent);color:#fff}.secondary{background:var(--accent-soft);color:var(--accent)}.content{max-width:1120px;margin:auto;padding:8px 24px 44px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}.section-head h2{font-size:15px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.category-bar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin:6px 0 4px}.category-bar button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--surface);color:var(--muted)}.category-bar button.active{background:var(--accent);border-color:var(--accent);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}.app{position:relative;min-height:116px;padding:12px 8px 8px;border:1px solid transparent;border-radius:16px;text-align:center;background:transparent;transition:.18s;user-select:none;outline:0}.app:hover,.app.selected{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow);transform:translateY(-2px)}.app.selected{border-color:var(--accent);box-shadow:0 0 0 3px #1769e01c,var(--shadow)}.app.dragging{opacity:.45}.app.over{border-color:var(--accent);background:var(--accent-soft)}.app button.launch{display:block;width:100%;background:transparent;color:inherit}.app-icon{width:58px;height:58px;margin:0 auto 8px;border-radius:15px;display:grid;place-items:center;overflow:hidden;background:var(--icon-bg);color:var(--muted);font-size:28px;font-weight:700}.app-icon img{width:100%;height:100%;object-fit:cover}.app-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.pin{position:absolute;right:5px;top:4px;width:25px;height:25px;border-radius:50%;background:transparent;color:#9aa3b2;opacity:0}.app:hover .pin,.pin.active,.app.selected .pin{opacity:1}.pin.active{color:var(--accent);background:var(--accent-soft)}.empty{padding:42px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;background:color-mix(in srgb,var(--surface) 55%,transparent)}.footer{max-width:1120px;margin:auto;padding:0 24px 24px;text-align:center;color:var(--muted);font-size:12px}.modal-backdrop{position:fixed;inset:0;background:#17203366;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(560px,100%);max-height:calc(100vh - 36px);overflow:auto;background:var(--surface);color:var(--text);border-radius:18px;padding:22px;box-shadow:0 24px 70px #11213d40}.modal h2{margin:0 0 18px;font-size:18px}.form-grid{display:grid;gap:12px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:5px}.field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;outline:0;background:var(--surface);color:var(--text)}.field input:focus,.field select:focus{border-color:var(--accent)}.field small{display:block;color:var(--muted);margin-top:5px}.setting{display:flex;align-items:center;gap:9px;padding:10px 0}.setting input{accent-color:var(--accent)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.manage-list{display:grid;gap:8px;margin-top:16px}.manage-item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px}.manage-item .mini{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--icon-bg);overflow:hidden}.manage-item .mini img{width:100%;height:100%;object-fit:cover}.manage-item .grow{flex:1}.manage-item small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 15px;border-radius:9px;z-index:8;box-shadow:var(--shadow)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#202124;--surface:#292a2d;--text:#f1f3f4;--muted:#a9b0ba;--line:#464950;--accent:#8ab4f8;--accent-soft:#303f5b;--icon-bg:#3a3b3f;--shadow:0 10px 30px #00000035}:root:not([data-theme=light]) body{background:radial-gradient(circle at 50% -10%,#26344d 0,transparent 42%),var(--bg)}}
[data-theme=dark]{color-scheme:dark;--bg:#202124;--surface:#292a2d;--text:#f1f3f4;--muted:#a9b0ba;--line:#464950;--accent:#8ab4f8;--accent-soft:#303f5b;--icon-bg:#3a3b3f;--shadow:0 10px 30px #00000035}[data-theme=dark] body{background:radial-gradient(circle at 50% -10%,#26344d 0,transparent 42%),var(--bg)}
@media(max-width:650px){.topbar{padding:18px 14px 8px;flex-wrap:wrap}.search{order:1;flex-basis:100%}.actions{order:0;margin-left:auto}.content{padding:8px 14px 35px}.grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}.app{min-height:104px;padding-inline:4px}.app-icon{width:52px;height:52px}.actions .label{display:none}}
</style></head>
<body><header class="topbar"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="アプリを検索…（Ctrl / ⌘ + K）" autocomplete="off" autofocus></div><div class="actions"><button class="icon-btn" id="manage" title="設定・アプリ管理">⚙</button><button class="primary" id="add"><span class="label">アプリを追加</span><span class="mobile-plus">＋</span></button></div></header>
<main class="content"><nav class="category-bar" id="categoryBar" aria-label="カテゴリ"></nav><section id="recentSection"><div class="section-head"><h2>最近使ったアプリ</h2><span id="recentCount"></span></div><div class="grid" id="recentGrid"></div></section><section><div class="section-head"><h2>すべてのアプリ</h2><span id="appCount"></span></div><div class="grid" id="appGrid"></div><div class="empty hidden" id="empty">まだアプリがありません。右上の「アプリを追加」から登録してください。</div></section></main><footer class="footer">矢印キーで選択・Enterで起動 · ドラッグ＆ドロップで並び替え · データはこのブラウザに保存</footer>
<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">アプリを追加</h2><form id="appForm"><div class="form-grid"><div class="field"><label for="name">アプリ名 *</label><input id="name" required maxlength="40" placeholder="例：Google ドライブ"></div><div class="field"><label for="url">URL *</label><input id="url" type="url" required placeholder="https://drive.google.com/"></div><div class="field"><label for="icon">アイコンURL（任意）</label><input id="icon" type="url" placeholder="空欄ならPWAアイコンを優先取得"><small>manifest.jsonのアイコン、apple-touch-icon、faviconの順で取得を試みます。</small></div><div class="field"><label for="note">メモ（任意）</label><input id="note" maxlength="80" placeholder="仕事用、学校用など"></div><div class="field"><label for="category">カテゴリ / フォルダ（任意）</label><input id="category" maxlength="30" placeholder="例：仕事、学校、開発"></div></div><div class="modal-actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button class="primary" type="submit">保存</button></div></form></div></div>
<div class="modal-backdrop hidden" id="manageBackdrop"><div class="modal"><h2>設定・アプリ管理</h2><div class="form-grid"><div class="field"><label for="theme">テーマ</label><select id="theme"><option value="auto">端末設定に合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option></select></div><label class="setting"><input id="closeAfterLaunch" type="checkbox">アプリ起動後、このランチャーのタブを閉じる</label></div><p style="color:var(--muted);margin:14px 0 0">タブを閉じる機能はブラウザの安全制限により、スクリプトで開いたウィンドウなど許可された場合のみ動作します。</p><div class="modal-actions" style="justify-content:flex-start"><button class="secondary" id="export">JSONを書き出す</button><button class="secondary" id="importBtn">JSONを読み込む</button><input id="importFile" type="file" accept="application/json" class="hidden"></div><div class="manage-list" id="manageList"></div><div class="modal-actions"><button class="secondary" id="manageClose">閉じる</button></div></div></div><div class="toast hidden" id="toast"></div>
<script>
(()=>{const KEY='my-chromebook-launcher-v1',SET='my-chromebook-launcher-settings-v1',starter=[{id:'drive',name:'Google ドライブ',url:'https://drive.google.com/',icon:'https://ssl.gstatic.com/docs/drive/images/drive_2022q4_64dp.png',pinned:true,note:'',category:'仕事',recent:0,uses:0},{id:'youtube',name:'YouTube',url:'https://www.youtube.com/',icon:'https://www.youtube.com/s/desktop/40b271ca/img/favicon_144x144.png',pinned:false,note:'',category:'動画',recent:0,uses:0},{id:'calendar',name:'Google カレンダー',url:'https://calendar.google.com/',icon:'https://ssl.gstatic.com/calendar/images/dynamiclogo_2020q4/calendar_31_2x.png',pinned:false,note:'',category:'仕事',recent:0,uses:0},{id:'github',name:'GitHub',url:'https://github.com/',icon:'https://github.githubassets.com/favicons/favicon.png',pinned:false,note:'',category:'開発',recent:0,uses:0}],$=id=>document.getElementById(id);let apps=loadApps(),settings=loadSettings(),editingId=null,dragId=null,selectedIndex=-1,activeCategory='all';function loadApps(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)&&x.length?x.map(a=>({...a,category:a.category||'未分類',uses:Number(a.uses)||0,recent:Number(a.recent)||0})):starter}catch{return starter}}function loadSettings(){try{return{theme:'auto',closeAfterLaunch:false,...JSON.parse(localStorage.getItem(SET))}}catch{return{theme:'auto',closeAfterLaunch:false}}}function save(){localStorage.setItem(KEY,JSON.stringify(apps))}function saveSettings(){localStorage.setItem(SET,JSON.stringify(settings))}function applyTheme(){document.documentElement.dataset.theme=settings.theme==='auto'?'':settings.theme;$('theme').value=settings.theme}function fallbackIcon(a){return`https://www.google.com/s2/favicons?domain=${encodeURIComponent(a.url)}&sz=128`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function icon(a){const i=a.icon||'';if(i&&!i.includes('/')&&!i.includes(':'))return`<span>${esc(i)}</span>`;return`<img src="${esc(i||fallbackIcon(a))}" alt="" onerror="this.onerror=null;this.style.display='none';this.parentElement.textContent='${String((a.name||'?')[0]).replace(/['\\]/g,'\\$&')}'">`}function card(a){const e=document.createElement('article');e.className='app';e.draggable=true;e.dataset.id=a.id;e.innerHTML=`<button class="launch" title="${esc(a.note||a.name)}"><div class="app-icon">${icon(a)}</div><span class="app-name">${esc(a.name)}</span></button><button class="pin ${a.pinned?'active':''}" title="${a.pinned?'固定を解除':'上部に固定'}">★</button>`;e.querySelector('.launch').onclick=()=>launch(a);e.querySelector('.pin').onclick=x=>{x.stopPropagation();a.pinned=!a.pinned;save();render()};e.addEventListener('dragstart',()=>{dragId=a.id;e.classList.add('dragging')});e.addEventListener('dragend',()=>{dragId=null;e.classList.remove('dragging')});e.addEventListener('dragover',x=>{x.preventDefault();e.classList.add('over')});e.addEventListener('dragleave',()=>e.classList.remove('over'));e.addEventListener('drop',x=>{x.preventDefault();e.classList.remove('over');reorder(dragId,a.id)});return e}function score(a,q){const t=`${a.name} ${a.note} ${a.url}`.toLowerCase(),i=t.indexOf(q),n=a.name.toLowerCase();return(n===q?100000:0)+(n.startsWith(q)?10000:0)+(a.uses||0)*250+(a.recent?Math.max(0,5000-(Date.now()-a.recent)/60000):0)+(i<0?0:1000-i)}function visible(){return[...document.querySelectorAll('#appGrid .app')]}function select(i){const c=visible();c.forEach(x=>x.classList.remove('selected'));if(!c.length){selectedIndex=-1;return}if(selectedIndex<0){selectedIndex=0}else{const current=c[selectedIndex],direction=i>selectedIndex?'next':i<selectedIndex?'prev':'next',rect=current?.getBoundingClientRect();if(rect){const candidates=c.map((el,index)=>({el,index,rect:el.getBoundingClientRect()})).filter(x=>x.index!==selectedIndex);const horizontal=direction==='next'&&i-selectedIndex===1||direction==='prev'&&selectedIndex-i===1;let best=null,bestScore=Infinity;if(horizontal){for(const x of candidates){const dx=direction==='next'?x.rect.left-rect.right:rect.left-x.rect.right;if(dx>=-2){const score=Math.abs(x.rect.top-rect.top)*4+Math.max(0,dx);if(score<bestScore){best=x;bestScore=score}}}}else{const down=i>selectedIndex;for(const x of candidates){const dy=down?x.rect.top-rect.bottom:rect.top-x.rect.bottom;if(dy>=-2){const score=Math.abs(x.rect.left-rect.left)*4+Math.max(0,dy);if(score<bestScore){best=x;bestScore=score}}}}if(best)selectedIndex=best.index;else selectedIndex=(i+c.length)%c.length}}c[selectedIndex].classList.add('selected');c[selectedIndex].scrollIntoView({block:'nearest',inline:'nearest'})}function reorder(f,t){if(!f||f===t)return;const fi=apps.findIndex(a=>a.id===f),ti=apps.findIndex(a=>a.id===t),[m]=apps.splice(fi,1);apps.splice(ti,0,m);save();render()}function launch(a){a.recent=Date.now();a.uses=(a.uses||0)+1;save();render();window.open(a.url,'_blank','noopener');if(settings.closeAfterLaunch)setTimeout(()=>window.close(),80)}function renderCategories(){const names=[...new Set(apps.map(a=>a.category||'未分類'))].sort((a,b)=>a.localeCompare(b,'ja'));const bar=$('categoryBar');bar.replaceChildren(...['all',...names].map(name=>{const b=document.createElement('button');b.type='button';b.textContent=name==='all'?'すべて':name;b.className=activeCategory===name?'active':'';b.onclick=()=>{activeCategory=name;render()};return b}))}function render(){renderCategories();const q=$('search').value.trim().toLowerCase(),categoryFiltered=activeCategory==='all'?apps:apps.filter(a=>(a.category||'未分類')===activeCategory),filtered=categoryFiltered.filter(a=>!q||`${a.name} ${a.note} ${a.url} ${a.category||''}`.toLowerCase().includes(q)),recent=filtered.filter(a=>a.recent).sort((a,b)=>b.recent-a.recent).slice(0,8),ordered=filtered.slice().sort((a,b)=>q?score(b,q)-score(a,q):b.pinned-a.pinned);$('recentGrid').replaceChildren(...recent.map(card));$('recentSection').classList.toggle('hidden',!recent.length||!!q);$('appGrid').replaceChildren(...ordered.map(card));$('appCount').textContent=`${filtered.length}件`;$('recentCount').textContent=recent.length?`${recent.length}件`:'';$('empty').classList.toggle('hidden',filtered.length>0);selectedIndex=-1}async function resolveIcon(url){try{const p=await fetch(url),d=new DOMParser().parseFromString(await p.text(),'text/html'),m=d.querySelector('link[rel~="manifest"]');if(m){const u=new URL(m.getAttribute('href'),url),r=await fetch(u);if(r.ok){const x=await r.json(),i=(x.icons||[]).filter(z=>z.src).sort((a,b)=>(parseInt(b.sizes)||0)-(parseInt(a.sizes)||0))[0];if(i)return new URL(i.src,u).href}}const f=d.querySelector('link[rel~="apple-touch-icon"],link[rel~="icon"],link[rel="shortcut icon"]');if(f)return new URL(f.getAttribute('href'),url).href}catch{}return fallbackIcon({url})}function openForm(a){editingId=a?.id||null;$('modalTitle').textContent=a?'アプリを編集':'アプリを追加';$('name').value=a?.name||'';$('url').value=a?.url||'';$('icon').value=a?.icon||'';$('note').value=a?.note||'';$('category').value=a?.category||'';$('modalBackdrop').classList.remove('hidden');$('name').focus()}function closeForm(){$('modalBackdrop').classList.add('hidden');editingId=null}function manageList(){const l=$('manageList');l.replaceChildren(...apps.map(a=>{const r=document.createElement('div');r.className='manage-item';r.innerHTML=`<div class="mini">${icon(a)}</div><div class="grow"><b>${esc(a.name)}</b><small>${esc(a.url)}</small></div><button class="icon-btn edit" title="編集">✎</button><button class="icon-btn del" title="削除">🗑</button>`;r.querySelector('.edit').onclick=()=>openForm(a);r.querySelector('.del').onclick=()=>{if(confirm(`「${a.name}」を削除しますか？`)){apps=apps.filter(x=>x.id!==a.id);save();manageList();render()}};return r}))}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}$('search').oninput=render;$('search').onkeydown=e=>{if(e.key==='Escape'){$('search').value='';render();return}if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)){e.preventDefault();const c=visible(),cols=Math.max(1,Math.floor($('appGrid').clientWidth/122));if(e.key==='ArrowDown')select(selectedIndex<0?0:selectedIndex+cols);else if(e.key==='ArrowUp')select(selectedIndex<0?c.length-1:selectedIndex-cols);else if(e.key==='ArrowRight')select(selectedIndex+1);else select(selectedIndex<0?c.length-1:selectedIndex-1);return}if(e.key==='Enter'){const c=visible()[selectedIndex],a=c&&apps.find(x=>x.id===c.dataset.id);if(a)launch(a)}};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();$('search').select()}});$('add').onclick=()=>openForm();$('cancel').onclick=closeForm;$('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeForm()};$('appForm').onsubmit=async e=>{e.preventDefault();const d={name:$('name').value.trim(),url:$('url').value.trim(),icon:$('icon').value.trim(),note:$('note').value.trim(),category:$('category').value.trim()||'未分類'};if(!d.icon){toast('PWAアイコンを確認中…');d.icon=await resolveIcon(d.url)}if(editingId)Object.assign(apps.find(a=>a.id===editingId),d);else apps.push({id:crypto.randomUUID(),...d,pinned:false,recent:0,uses:0});save();closeForm();render();manageList();toast('保存しました')};$('manage').onclick=()=>{$('manageBackdrop').classList.remove('hidden');$('closeAfterLaunch').checked=settings.closeAfterLaunch;applyTheme();manageList()};$('theme').onchange=e=>{settings.theme=e.target.value;saveSettings();applyTheme()};$('closeAfterLaunch').onchange=e=>{settings.closeAfterLaunch=e.target.checked;saveSettings()};$('manageClose').onclick=()=>$('manageBackdrop').classList.add('hidden');$('manageBackdrop').onclick=e=>{if(e.target.id==='manageBackdrop')$('manageBackdrop').classList.add('hidden')};$('export').onclick=()=>{const b=new Blob([JSON.stringify(apps,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-chromebook-launcher.json';a.click();URL.revokeObjectURL(a.href);toast('書き出しました')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d)||d.some(a=>!a.name||!a.url))throw Error();apps=d.map(a=>({...a,id:a.id||crypto.randomUUID(),category:a.category||'未分類',pinned:!!a.pinned,recent:Number(a.recent)||0,uses:Number(a.uses)||0}));save();render();manageList();toast('読み込みました')}catch{alert('正しいランチャーJSONを選択してください')}e.target.value=''};applyTheme();render();setTimeout(()=>$('search').focus(),0)})();
</script></body></html>
